{% extends "base.html" %}
{% block title %}Login - Chancery{% endblock %}
{% block content %}
<div class="card auth-card">
    <div class="card-body">
        <h4 class="mb-1">Sign in</h4>
        <p class="text-body-secondary mb-4">Use your Chancery or directory account.</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus autocomplete="username">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>Login</button>
        </form>
    </div>
</div>
{% endblock %}
