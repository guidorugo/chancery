{% extends "base.html" %}
{% block title %}Two-factor code - Chancery{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card mt-5">
            <div class="card-header"><h4 class="mb-0">Second factor</h4></div>
            <div class="card-body">
                <p class="text-body-secondary">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="code" class="form-label">Code</label>
                        <input type="text" class="form-control" id="code" name="code" required autofocus autocomplete="one-time-code" inputmode="numeric" placeholder="123456 or ABCDE-FGHJK">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Verify</button>
                </form>
                <div class="mt-3 small"><a href="{{ url_for('auth.login') }}">Back to login</a></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
