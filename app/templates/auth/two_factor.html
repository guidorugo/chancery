{% extends "base.html" %}
{% block title %}Two-factor code - Chancery{% endblock %}
{% block content %}
<div class="card auth-card">
    <div class="card-body">
        <h4 class="mb-1">Second factor</h4>
        <p class="text-body-secondary mb-4">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4">
                <label for="code" class="form-label">Code</label>
                <input type="text" class="form-control form-control-lg text-center" id="code" name="code" required autofocus autocomplete="one-time-code" inputmode="numeric" placeholder="123456 or ABCDE-FGHJK">
            </div>
            <button type="submit" class="btn btn-primary w-100">Verify</button>
        </form>
        <div class="mt-3 small text-center"><a href="{{ url_for('auth.login') }}">Back to login</a></div>
    </div>
</div>
{% endblock %}
