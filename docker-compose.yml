services:
  app:
    build: .
    # To use the pre-built image instead of building locally, comment out 'build' and uncomment:
    # image: ghcr.io/guidorugo/cert-manager:latest
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      # A2/A1-tier0: MASTER_PASSPHRASE is delivered as a Docker secret (file at
      # /run/secrets/master_passphrase) instead of an env var, so it does not
      # appear in `docker inspect`, /proc/<pid>/environ, or the compose env.
      # (SECRET_KEY can be moved the same way via SECRET_KEY_FILE if desired.)
      - MASTER_PASSPHRASE_FILE=/run/secrets/master_passphrase
      - DATABASE_URL=sqlite:////app/data/cert-manager.db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      # INFRA-4: ADMIN_PASSWORD seeds the first admin (removable after first
      # login). To keep it out of `docker inspect` / the process env, deliver it
      # as a Docker secret instead — set ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      # and add an admin_password secret (the app honours the *_FILE convention).
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - SERVER_NAME_FOR_OCSP=${SERVER_NAME_FOR_OCSP:-localhost:5000}
      # This reference stack serves plain HTTP, so secure cookies are disabled;
      # put a TLS proxy in front and set SESSION_COOKIE_SECURE=true. If the app
      # runs behind a reverse proxy, set TRUSTED_PROXY_COUNT to the hop count.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT:-}
      # DoS-1: per-IP rate limiting (on by default; needs the bundled
      # Flask-Limiter). Set false to disable, or RATE_LIMIT_DEFAULT to tune.
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      # --- SoftHSM key backend (finding A1) — enabled by default ----------------
      # CA signing keys can live in a PKCS#11 token (non-exportable, never in app
      # memory). The image bundles softhsm2 (BSD-licensed); the entrypoint
      # initialises the token on first boot, and scripts/init-secrets.sh creates
      # the two PIN secrets. KEY_BACKEND stays 'software' so NEW CAs are
      # software-backed by default (still exportable) while HSM is offered
      # per-CA in the create form; set KEY_BACKEND=softhsm to make new CAs
      # HSM-backed. Migrate existing CAs with:
      #   docker compose exec app flask keys migrate-to-hsm
      - KEY_BACKEND=${KEY_BACKEND:-software}
      - SOFTHSM2_CONF=/app/data/softhsm/softhsm2.conf
      - PKCS11_MODULE=/usr/lib/softhsm/libsofthsm2.so
      - PKCS11_TOKEN_LABEL=cert-manager
      - PKCS11_USER_PIN_FILE=/run/secrets/pkcs11_user_pin
      - PKCS11_SO_PIN_FILE=/run/secrets/pkcs11_so_pin
      # LDAP authentication (optional feature - stays disabled unless
      # configured in .env; unset variables fall back to app defaults)
      - LDAP_ENABLED=${LDAP_ENABLED:-false}
      - LDAP_SERVER_URI=${LDAP_SERVER_URI:-}
      - LDAP_USE_STARTTLS=${LDAP_USE_STARTTLS:-false}
      - LDAP_TLS_VERIFY=${LDAP_TLS_VERIFY:-true}
      - LDAP_CA_CERT_FILE=${LDAP_CA_CERT_FILE:-}
      - LDAP_USER_DN_TEMPLATE=${LDAP_USER_DN_TEMPLATE:-}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LDAP_USER_SEARCH_BASE=${LDAP_USER_SEARCH_BASE:-}
      - LDAP_USER_FILTER=${LDAP_USER_FILTER:-}
      - LDAP_ADMIN_GROUP_DN=${LDAP_ADMIN_GROUP_DN:-}
      - LDAP_REQUESTER_GROUP_DN=${LDAP_REQUESTER_GROUP_DN:-}
      - LDAP_GROUP_MEMBER_ATTR=${LDAP_GROUP_MEMBER_ATTR:-}
      - LDAP_TIMEOUT_SECONDS=${LDAP_TIMEOUT_SECONDS:-}
      - BASIC_AUTH_CACHE_TTL_SECONDS=${BASIC_AUTH_CACHE_TTL_SECONDS:-}
      # Footer "Update available" badge — checks the latest GitHub release.
      # On by default; set UPDATE_CHECK_ENABLED=false in .env for an air-gapped
      # CA that must make no outbound call.
      - UPDATE_CHECK_ENABLED=${UPDATE_CHECK_ENABLED:-true}
      - UPDATE_CHECK_REPO=${UPDATE_CHECK_REPO:-}
      # Prometheus /metrics endpoint (2.7.0; opt-in, off by default). Manage
      # bearer tokens with `docker compose exec app flask metrics-token create`.
      - METRICS_ENABLED=${METRICS_ENABLED:-false}
      - METRICS_ALLOW_UNAUTHENTICATED=${METRICS_ALLOW_UNAUTHENTICATED:-false}
      - METRICS_INCLUDE_CA_DETAILS=${METRICS_INCLUDE_CA_DETAILS:-false}
    secrets:
      - master_passphrase
      - pkcs11_user_pin
      - pkcs11_so_pin
    restart: unless-stopped
    # INFRA-6: cap resources so a crashing/compromised worker can't exhaust the
    # host (memory / fork bomb). Tune to your box.
    mem_limit: 512m
    pids_limit: 256
    cpus: 2
    # Liveness/DB probe via the unauthenticated /health endpoint (curl is not in
    # the slim image, so use python). urlopen exits non-zero on 503/refused.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # H1: the app process runs as non-root (see entrypoint.sh). Block privilege
    # escalation and drop all Linux capabilities except the few the root startup
    # phase needs (chown the volume + setuid to drop privileges).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

secrets:
  master_passphrase:
    # Create this file (chmod 600) with your master passphrase; keep it out of
    # git (the ./secrets directory is gitignored). It must contain the SAME
    # passphrase used to encrypt the existing CA keys.
    file: ./secrets/master_passphrase
  # SoftHSM token PINs (generated by scripts/init-secrets.sh). Required because
  # the SoftHSM backend is enabled by default above.
  pkcs11_user_pin:
    file: ./secrets/pkcs11_user_pin
  pkcs11_so_pin:
    file: ./secrets/pkcs11_so_pin
