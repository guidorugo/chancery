name: Build and Push Docker Image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  schedule:
    # Weekly re-run of tests + dependency audit to catch newly-disclosed CVEs
    # in the pinned dependencies (I2).
    - cron: "0 6 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Actions are pinned to full commit SHAs (J1); the trailing comment records the
# human-readable version. Bump via Dependabot (.github/dependabot.yml).
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install SoftHSM (exercises the KEY_BACKEND=softhsm path)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2 libffi-dev

      - name: Install dependencies (hash-locked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Dependency vulnerability audit (pip-audit, I2)
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --desc

  build-and-push:
    needs: test
    # PRs and scheduled scans run tests only. On a push to master the image is
    # built for validation (not published); it is built AND published only on a
    # v* release tag.
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via GitHub OIDC (J2)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` tracks the newest v* release tag (latest=auto), not master.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Publish only on a v* tag; master builds are validation-only.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA provenance + SBOM attestations, pushed with the image on release (J2).
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published image (keyless, J2)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        # Store the signature at the legacy `sha256-<digest>.sig` tag so every
        # cosign version can verify it. cosign v3 otherwise defaults to the new
        # Sigstore bundle via the OCI 1.1 Referrers API, invisible to cosign
        # <3.0 ("no signatures found"). Both flags are required together:
        # --use-signing-config defaults to true in cosign v3 and mandates the
        # new bundle format, so it must be disabled alongside --new-bundle-format
        # to fall back to the classic keyless Fulcio + Rekor flow.
        run: cosign sign --yes --new-bundle-format=false --use-signing-config=false "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Trivy image vulnerability scan (H2)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report (don't block the release) — unfixed base-image CVEs are
          # Dependabot's job to bump; findings appear in the run log.
          exit-code: "0"
